; Ajustes de producción para el contenedor (Apache + mod_php)
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 128M
max_execution_time = 60
post_max_size = 16M
upload_max_filesize = 12M
date.timezone = UTC

; OPcache: la imagen es inmutable (cada deploy es una imagen nueva), no hace falta revisar archivos
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
