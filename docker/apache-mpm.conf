# Pocos procesos pero reutilizados: el plan tiene 512 MB. En uso real el servicio completo
# ronda los 60-120 MB, y con 8 procesos se llegó al tope en horas de movimiento.
<IfModule mpm_prefork_module>
    StartServers             3
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers       14
    MaxConnectionsPerChild 500
</IfModule>

# Libera el proceso rápido: la conexión del navegador pasa por el proxy de Render.
KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 100
Timeout 60

# Comprime texto y cachea las imágenes y videos estáticos
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
</IfModule>
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/jpeg "access plus 7 days"
    ExpiresByType image/png "access plus 7 days"
    ExpiresByType image/webp "access plus 7 days"
    ExpiresByType image/svg+xml "access plus 7 days"
    ExpiresByType video/mp4 "access plus 7 days"
</IfModule>

ServerTokens Prod
ServerSignature Off
